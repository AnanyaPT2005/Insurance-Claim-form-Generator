<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Review Medical Bill</title>
</head>

<body>

<h2>Review OCR Results</h2>

<p>
    Uploaded File:
    <span th:text="${ocr.uploadedFilePath}"></span>
</p>

<hr>

<form action="/bills/save" method="post">

    <h3>Bill Information</h3>

    Hospital / Pharmacy Name

    <input type="text"
           name="hospitalName"
           th:value="${ocr.hospitalName}">

    <br><br>

    Bill Number

    <input type="text"
           name="billNumber"
           th:value="${ocr.billNumber}">

    <br><br>

    Bill Date

    <input type="date"
           name="billDate"
           th:value="${ocr.billDate}">

    <br><br>

    Subtotal

    <input type="number"
           step="0.01"
           name="subtotal"
           th:value="${ocr.subtotal}">

    <br><br>

    Total

    <input type="number"
           step="0.01"
           name="total"
           th:value="${ocr.total}">

    <hr>

    <h3>Bill Items</h3>

    <table border="1">

        <tr>
            <th>Description</th>
            <th>Quantity</th>
            <th>Price</th>
        </tr>

        <tr th:each="item : ${ocr.items}">

            <td>

                <input type="text"
                       th:value="${item.description}">

            </td>

            <td>

                <input type="number"
                       th:value="${item.quantity}">

            </td>

            <td>

                <input type="number"
                       step="0.01"
                       th:value="${item.price}">

            </td>

        </tr>

    </table>

    <br>

    <button type="submit">

        Save Bill

    </button>

</form>

</body>
</html>
