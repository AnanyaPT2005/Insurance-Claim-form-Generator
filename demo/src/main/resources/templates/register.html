<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Register</title>

</head>

<body>

<h2>Create Account</h2>

<form th:action="@{/register}"
      th:object="${user}"
      method="post">

Username

<input type="text"
       th:field="*{username}">

<br><br>

Email

<input type="email"
       th:field="*{email}">

<br><br>

Password

<input type="password"
       th:field="*{passwordHash}">

<br><br>

<button type="submit">

Register

</button>

</form>

</body>

</html>
